title: Andrei Ciuculescu - Laravel & DevOps Specialist
email: andrei@ciuculescu.com
description: >-
  Professional Laravel backend developer and DevOps specialist with 13+ years experience 
  building scalable web solutions for small and medium businesses.
baseurl: ""
url: "https://ciuculescu.com"
twitter_username: 
github_username: ciuc123
linkedin_username: andrei-ciuculescu
author: Andrei Ciuculescu
permalink: /posts/:year-:month-:day-:title/

# Contact form endpoint: a Cloudflare Worker that sends the inquiry through Resend
# (source and setup: workers/contact/README.md). With no action set, the contact page
# shows only the email address, never a dead form.
contact_form:
  action: "/api/contact"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - workers/

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# SEO settings
lang: en
locale: en_US
timezone: Europe/Bucharest
