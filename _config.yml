title: Andrei Ciuculescu - Laravel & DevOps Specialist
email: andrei@ciuculescu.com
description: >-
  Professional Laravel backend developer and DevOps specialist since 2010, 
  building scalable web solutions for small and medium businesses.
baseurl: ""
url: "https://ciuculescu.com"
twitter_username: 
github_username: ciuc123
linkedin_username: andrei-ciuculescu
author: Andrei Ciuculescu
permalink: /posts/:year-:month-:day-:title/

# Contact form endpoint: a Cloudflare Worker that sends the inquiry through Resend
# (source and setup: workers/contact/README.md). With no action set, the contact page
# shows only the email address, never a dead form.
contact_form:
  action: "/api/contact"
  # Cloudflare Turnstile site key (public). Empty = no widget. The secret is only on the Worker.
  turnstile_site_key: "0x4AAAAAAGUJIwsGJ8PdVkg7"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - workers/
  - README.md
  - AGENT_PROMPTS.md
  - generate-welcome-pdf.sh
  - tests/
  - content/

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Tags that don't describe a topic, ignored when picking related posts (_includes/related.html).
related_skip_tags: [welcome-email, meta, client-zero]
related_fallback_tags: [laravel]

# Default share image (og:image / twitter:card) for pages without their own `image:`.
default_image: /assets/og-default.png

# Defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-default.png
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# SEO settings
lang: en
locale: en_US
timezone: Europe/Bucharest
