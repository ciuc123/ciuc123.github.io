# Daily Content Generation Workflow
# Automatically generates blog posts and LinkedIn content using GitHub Models API

name: Generate Daily Content

on:
  # Run daily at 9 AM UTC (adjust as needed)
  schedule:
    - cron: '0 9 * * *'
  
  # Allow manual triggering with optional topic
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific topic to write about (optional)'
        required: false
        type: string

# Permissions needed for the workflow
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Using minor version for automatic patch updates
          # The script has no breaking dependencies that would require a specific patch version
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt
      
      - name: Generate content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python .github/scripts/generate_content.py "${{ github.event.inputs.topic }}"
          else
            python .github/scripts/generate_content.py
          fi
      
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Add new blog post for ${{ steps.date.outputs.date }}
            
            Generated using GitHub Models API
          branch: content/blog-post-${{ steps.date.outputs.date }}
          delete-branch: true
          title: 'New Content: Blog Post for ${{ steps.date.outputs.date }}'
          body: |
            ## 📝 New Content Generated
            
            This PR contains automatically generated content for ${{ steps.date.outputs.date }}.
            
            ### Generated Files
            - Blog post in `_posts/`
            - LinkedIn post in `linkedin_posts/`
            
            ### Review Checklist
            - [ ] Review blog post content for accuracy
            - [ ] Check code examples are correct and functional
            - [ ] Verify LinkedIn post formatting
            - [ ] Ensure proper tags and metadata
            - [ ] Check word count (target: 1,500-2,500 words)
            - [ ] Verify 60% text / 40% code ratio
            
            ### How to Edit
            If changes are needed:
            1. Check out this branch locally
            2. Edit the files as needed
            3. Push changes back to this branch
            4. Merge when ready
            
            ---
            
            🤖 Generated by GitHub Models API
            Workflow: `.github/workflows/generate-daily-content.yml`
          labels: |
            content
            automated
            needs-review
          assignees: ciuc123
      
      - name: Summary
        run: |
          echo "## Content Generation Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A new Pull Request has been created with the generated content." >> $GITHUB_STEP_SUMMARY
          echo "Please review the content before merging." >> $GITHUB_STEP_SUMMARY
