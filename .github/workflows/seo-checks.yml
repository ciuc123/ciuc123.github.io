name: SEO checks

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # Debian image with Ruby 3.2 and Python 3: the github-pages gem's commonmarker 0.23 doesn't
    # compile with the compiler on ubuntu-latest (26.04). Same image as local builds.
    container: ruby:3.2-trixie
    steps:
      - uses: actions/checkout@v4

      - name: Audit tool unit tests
        run: python3 -m unittest discover -s tools/seo_audit/tests -v

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-ruby3.2-trixie-${{ hashFiles('Gemfile.lock') }}

      - name: Install gems
        run: |
          gem install bundler:2.7.1 --no-document
          bundle _2.7.1_ config set path vendor/bundle
          bundle _2.7.1_ install --jobs 4

      - name: Build site (Jekyll, as GitHub Pages does)
        run: bundle _2.7.1_ exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: SEO audit of _site and _posts
        # Fails on rules at "error" severity. Rules still being fixed are "warning" in .seo-audit.json.
        run: python3 tools/seo_audit audit-site _site --posts _posts --json seo-report.json --markdown seo-report.md

      - name: Report in the job summary
        if: always()
        run: test -f seo-report.md && cat seo-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-report
          path: seo-report.*
          if-no-files-found: ignore
