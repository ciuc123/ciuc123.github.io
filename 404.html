---
layout: default
title: Page not found
permalink: /404.html
sitemap: false
---
<section class="not-found section--full">
  <div class="inner">
    <h1>Page not found</h1>
    <p>This page doesn't exist, or it moved. Try one of these instead:</p>
    <p class="not-found__links">
      <a href="{{ '/' | relative_url }}" class="btn btn-secondary">Home</a>
      <a href="{{ '/posts/' | relative_url }}" class="btn btn-secondary">All posts</a>
      <a href="{{ '/contact/' | relative_url }}" class="btn btn-primary" data-cta="404-contact">Get in touch</a>
    </p>
    <div class="not-found__recent">
      <h2>Recent posts</h2>
      <ul>
        {%- for post in site.posts limit: 5 %}
        <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
        {%- endfor %}
      </ul>
    </div>
  </div>
</section>
